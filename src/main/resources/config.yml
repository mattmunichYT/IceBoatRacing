# IceBoatRacing, a powerful plugin for your ice boat racing server.
# - Developed by mattmunich
#
# ----------------------------------------------------------------
# Welcome to the main configuration file of this plugin.
# Below, you can change the main settings for this plugin,
# like the language, the number of laps required to finish
# a race and more.
# ----------------------------------------------------------------
# Some instructions:
# - The default value for race.lights.x/y/z is 123456789,
#   if they are read by the plugin, the race lights are
#   automatically disabled.
# ----------------------------------------------------------------

# Will read from the file [language].yml, so by default: en_US.yml
language: en_US

# Configure the per-player sidebars shown during official races.
# Text supports legacy section-sign color codes (for example §b) and %placeholders%.
# Each lines entry becomes one sidebar row, in the configured order; at most 15 rows are shown.
raceSidebar:
  racer:
    title: "§3-- §bIce Boat Racing §3--"
    emptyValue: "---"
    # Racer placeholders: %race%, %player%, %position%, %lap%, %currentLap%, %completedLapCount%, %lapCount%,
    # %lapProgress%, %lastLapTime%, %bestLapTime%, %raceTime%, %gapToLeader%, %gapToNext%, %gapToPrevious%,
    # %completedPitStops%, %requiredPitStops%, %remainingPitStops%, %positionChange%, %playersRemaining%, %isLeader%.
    # Nearby row placeholders: %aheadLine%, %selfLine%, %behindLine%.
    # The row format placeholders are %position%, %player%, %gap%, %lap%.
    aheadFormat: "§e%position%. §f%player% §7%gap%"
    selfFormat: "§b> %position%. §f%player% §7%gap%"
    behindFormat: "§7%position%. §f%player% §8%gap%"
    lines:
      - "§7%race%"
      - ""
      - "§bPOS §f%position%"
      - "§bLAP §f%completedLapCount%/%lapCount%"
      - "§bLAST §f%lastLapTime%"
      - "§bBEST §f%bestLapTime%"
      - "§bGAP §f%gapToLeader%"
      - ""
      - "%aheadLine%"
      - "%selfLine%"
      - "%behindLine%"
      - ""
      - "§bPITS §f%completedPitStops%/%requiredPitStops%"
  spectator:
    title: "§3-- §bIce Boat Racing §3--"
    emptyValue: "---"
    # Spectator placeholders: %race%, %racerCount%, %playersRemaining%, %lapCount%, %requiredPitStops%,
    # %leader%, %leaderLap%, %leaderLapProgress%, %leaderBestLap%, and %top1% / %top2% / %top3%.
    # Top row format placeholders: %position%, %player%, %gap%, %lap%.
    topFormat: "§b%position%. §f%player% §7%gap%"
    lines:
      - "§7%race%"
      - "§7LIVE STANDINGS"
      - "%top1%"
      - "%top2%"
      - "%top3%"
      - ""
      - "§bON TRACK §f%playersRemaining%"

# Configure the race.
race:
  # Whether a player should be allowed to continue racing even after logging out and back in
  allowRejoin: true

  # The racer's GameMode during the race
  ## Use ADVENTURE, SURVIVAL or CREATIVE (will probably not work with SPECTATOR)
  racingGameMode: ADVENTURE

  # Will prevent the checkpoints for working if the racer's
  # GameMode is not `racingGameMode`
  enforceRacingGameMode: true

  # Whether the player should be put is spectator mode when they finish the race.
  ## - true: player will be put in spectator mode
  ## - false: player will remain on track and be able to freely continue boating
  spectateOnFinish: true

  # Whether a player's car should be removed when they log out
  ## If allowRejoin is false, the car will always be removed
  removeCarWhenLoggingOut: false

  # Configure the race lights
  # -> colored glass that will change on
  #    race start to simulate race lights
  lights:
    enabled: false
    from:
      x: 123456789
      y: 123456789
      z: 123456789
    to:
      x: 123456789
      y: 123456789
      z: 123456789

# Configure the race statistics system.
stats:
  # Maximum number of individual lap records stored per player per race.
  # Older entries are dropped when the limit is exceeded.
  # Set to a higher value to retain more history for ghost replay in the future.
  maxLapHistory: 100
