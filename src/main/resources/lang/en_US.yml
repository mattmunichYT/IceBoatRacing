# IceBoatRacing, a powerful plugin for your ice boat racing server.
# - Developped by mattmunich
#
# ----------------------------------------------------------------
# Welcome to the en_US message configuration file.
# Below, you can change the messages that will be shown by
# the plugin when the language in config.yml is set to
# this file's name (without the .yml)
# ----------------------------------------------------------------
# Some instructions:
# - Color codes
# You can use the § sign followed by a specific caracther to
# add color to these messages.
#
# - Arguments/Variables
# Some messages support arguments that will be formatted like:
# %argument%. These will are hard-coded in the plugin and will
# be replaced indenpendently from this config. If they are
# missing, they just won't show up in the message.
# ----------------------------------------------------------------


#The prefix used in the beggining of every message
#(except titles and messages under the "noPrefix" section)
prefix: "<b><gradient:#8DABF3:#10CA9A>[Ice Boat Racing]</gradient></b>"

noPrefix:
  #The title of the scoreboard during a race
  liveSidebarTitle: "§3-- §b§lBoat Race §3--"
  #Join and leave messages
  join: "§7[§a+§7] §b%player%"
  quit: "§7[§c-§7] §b%player%"

checkpoint:
  #Messages regarding the checkpoint setting pos
  pos:
    1: "§bCheckpoint §3position 1§b set to §3%x%§b, §3%y%§b, §3%z%§b."
    2: "§bCheckpoint §3position 2§b set to §3%x%§b, §3%y%§b, §3%z%§b."
    notSet: "§cSelect §4both positions§c first!\n§8ℹ Use a wooden shovel"
  #Success messages
  startLineSaved: "§aStart line saved!\n§8ℹ Use /checkpoint setFinish if your finish line differs from the start"
  finishLineSaved: "§aFinish line saved!"
  saved: "§aCheckpoint §2%index%§a saved"
  sectorSaved: "§aSector §e%index% §asaved!"
  removed: "§aCheckpoint §6%index%§a removed"
  count: "§aThere are %count% checkpoints"
  resetPlayerScore: "§aScore of §6%player%§a reset"
  normalized: "§aCheckpoints normalized"
  #Errors
  notInCheckpoint: "§cYou are not in a checkpoint\n§8ℹ You can also use /checkpoint list"
  invalid: "§cInvalid checkpoint number"
  noCheckpoint: "§cNo checkpoint defined"

race:
  #Will be displayed to every player
  start: "§aRace starting..." #Displayed when '/race start' is used
  end: "§cThe race is over!" #Displayed when '/race end' is used

  #Only displayed to the command executor
  prepare: "§aPlayers will be placed automatically." #Displayed when '/race prepare' is used (and prepare toggled OFF)
  cancelPrepare: "§aPrepare mode disabled." #Displayed when '/race prepare' is used (and prepare toggled ON)

  #In race events
  onCompleteLap:
    title: "§6%currentLapCount%/%raceLapCount%"
    subtitle: "§alaps completed"
    message: "§3%player%§b finished lap §3%count%§b in §3%time%§b!"
  onCrossSector: "§b§3%player%§b's time at sector §3%count%§b: §3%time%§b"

  #Help message
  help: "§3--------- §b§l/race§r §3---------\n§3->§a start §8-§7 Start the race\n§3->§a prepare §8-§7 Prepare players\n§7§oℹ Automatically places players in their boats\n§3->§a end §8-§7 End the race"

car:
  #Errors
  invalidID: "§cNo car with ID §4%id%"
  noCars: "§cNo cars defined."

  #Command success feedback
  changedOwner: "§aOwner changed: %owner%"
  removed: "§aCar removed (id %id%)"

  #Messages/titles shown in the car creation process
  create:
    1:
      title: "§aSet Spawn"
      subtitle: "§e%check% §ato confirm"
      message: "§aBreak the spawn block, then type %check%."
      selected: "§bBlock selected, type §3%check%§b."
      noSelection: "§cSelect a block first!"
      check: "done"
      completed: "§aPosition saved."

    2:
      title: "§aOwner Name"
      subtitle: "§eEnter the owner's name in chat"
      message: "§aType the owner's name in chat."
      completed: "§aOwner: %owner%."

    3:
      title: "§aChoose Boat"
      subtitle: "§e%check% §ato confirm"
      message: "§aHold a boat and type §e%check%§a."
      invalidItem: "§cHold a boat in your hand!"
      check: "done"

    completed:
      message: "§aThe car has been saved."
      title: "§2§lDone!"
      subtitle: "§aCar saved"

#Some basic error messages
error:
  invalidNumber: "§cInvalid number"
  playerNotFound: "§cPlayer not found"
  playerToExecuteCommand: "§cYou must be a player to do this."