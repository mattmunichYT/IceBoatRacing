# IceBoatRacing, a powerful plugin for your ice boat racing server.
# - Developed by mattmunich
#
# ----------------------------------------------------------------
# Welcome to the en_US message configuration file.
# Below, you can change the messages that will be shown by
# the plugin when the language in config.yml is set to
# this file's name (without the .yml)
# ----------------------------------------------------------------
# Some instructions:
# - Color codes
# You can use the § sign followed by a specific character to
# add color to these messages.
#
# - Arguments/Variables
# Some messages support arguments that will be formatted like:
# %argument%. These will are hard-coded in the plugin and will
# be replaced independently of this config. If they are
# missing, they just won't show up in the message.
# ----------------------------------------------------------------


#The prefix used in the beginning of every message
#(except titles and messages under the "noPrefix" section)
prefix: "<b><gradient:#8DABF3:#10CA9A>[Ice Boat Racing]</gradient></b>"

noPrefix:
  #The title of the scoreboard during a race
  liveSidebarTitle: "§3-- §b§lBoat Race §3--"
  #Join and leave messages
  join: "§7[§a+§7] §b%player%"
  quit: "§7[§c-§7] §b%player%"

checkpoint:
  #Messages regarding the checkpoint setting pos
  pos:
    1: "§bCheckpoint position §31§b set to §3%x%§b, §3%y%§b, §3%z%§b."
    2: "§bCheckpoint position §32§b set to §3%x%§b, §3%y%§b, §3%z%§b."
    notSet: "§cSelect §4both positions§c first!\n§8ℹ With a wooden shovel"
  #Success messages
  startLineSaved: "§aStart line saved!\n§8ℹ Do /checkpoint setFinish if your finish line is different from the start line"
  finishLineSaved: "§aFinish line saved!"
  saved: "§aCheckpoint §2%id%§a saved"
  sectorSaved: "§aSector §e%sectorID% §asaved!"
  removed: "§aCheckpoint §6%id%§a removed"
  count: "§aThere are %count% checkpoints"
  resetPlayerScore: "§aReset score for §6%player%§a"
  nearestCheckpointID: "§bThe nearest checkpoint for race §3%race%§b has ID §3%id%"

  #Errors
  notInCheckpoint: "§cYou are not in a checkpoint\n§8ℹ You can also do /checkpoint list"
  invalid: "§cInvalid checkpoint number"
  noCheckpoint: "§cNo checkpoint defined"

  #Main /checkpoint help fallback
  help: "§eCheckpoint commands:\n§7- §f/checkpoint list\n§7- §f/checkpoint count\n§7- §f/checkpoint create <raceName> [\"SECTOR\"]\n§7- §f/checkpoint setFinish <raceName>\n§7- §f/checkpoint remove [raceName] [checkpointID]\n§7- §f/checkpoint resetData <player> <raceName>\n§7- §f/checkpoint autotrace start|stop|preview|sector|resize|delete|accept|cancel\n§7- §f/checkpoint addAlternate <raceName> <checkpointID>\n§7- §f/checkpoint clearAll <raceName>"

  #Tags shown in /checkpoint list
  list:
    planeTag: " §7[plane]"
    altTag: " §7[+%count% alt]"

  #Auto-trace (recording/generation) commands
  autotrace:
    help: "§eAuto-trace commands:\n§7- §f/checkpoint autotrace start <raceName> [spacing] [width] [height] [loop|noloop]\n§7- §f/checkpoint autotrace stop\n§7- §f/checkpoint autotrace preview §7(toggle)\n§7- §f/checkpoint autotrace sector §7(click 2 blocks with the shovel first)\n§7- §f/checkpoint autotrace resize §7(click 2 blocks defining the correct width)\n§7- §f/checkpoint autotrace delete §7(stand near the checkpoint to delete)\n§7- §f/checkpoint autotrace accept\n§7- §f/checkpoint autotrace cancel"
    usageStart: "§cUsage: /checkpoint autotrace start <raceName> [spacing] [width] [height] [loop|noloop]"
    started: "§aRecording started for race §f%race%§a. Walk or boat around the entire track.\n§8ℹ Recording stops automatically once you return near the start point, or run §f/checkpoint autotrace stop §8manually."
    noSession: "§cYou do not have an active auto-trace session."
    notEnoughPoints: "§cNot enough points recorded to generate checkpoints. Try again."
    stopped: "§aRecording stopped. §f%count% §acheckpoints generated.\n§8ℹ Run §f/checkpoint autotrace preview §8to see them, §f/checkpoint autotrace sector §8to mark sectors, or §f/checkpoint autotrace accept §8to save."
    loopClosed: "§aLoop closed — recording stopped automatically. §f%count% §acheckpoints generated.\n§8ℹ Run §f/checkpoint autotrace preview §8to see them."
    noPreview: "§cNo generated checkpoints to preview.\n§8ℹ Run start and then stop first."
    previewOn: "§aPreview enabled §7— run the command again to disable it."
    previewOff: "§7Preview disabled."
    noPreviewForSector: "§cNo active preview to add a sector to.\n§8ℹ Run start and then stop first."
    sectorMarked: "§aSector marked.\n§8ℹ Run §f/checkpoint autotrace preview §8to see it, or mark other sectors."
    sectorFailed: "§cCould not place sector here.\n§8ℹ Try clicking closer to the recorded path."
    resizeFailed: "§cNo checkpoint found near those clicks.\n§8ℹ Try clicking closer to the one you want to resize."
    resized: "§aCheckpoint §f#%position% §a(§f%type%§a) resized based on your clicks §7(at %distance% blocks)."
    deleteFailed: "§cNo checkpoint found near you to delete."
    deleted: "§7Checkpoint §f#%position% §7(§f%type%§7) removed from preview §7(at %distance% blocks)."
    acceptFailed: "§cNothing to save.\n§8ℹ Generate a preview first (start, then stop)."
    accepted: "§aAuto-traced checkpoints saved!"
    cancelled: "§7Auto-trace session cancelled."

  #Alternate route (bypass gate) command
  addAlternate:
    added: "§aAlternate route added for checkpoint §f#%id%§a."

  #Bulk checkpoint clearing
  clearAll:
    warning: "§c⚠ This will permanently delete §f%count% §ccheckpoint(s) from race §f%race%§c."
    confirmHint: "§cRun §f/checkpoint clearAll %race% §cagain within 10 seconds to confirm."
    cleared: "§aAll checkpoints for race §f%race% §ahave been deleted."

race:
  #Will be displayed to every player
  start: "§aRace %race% starting..." #Displayed when '/race start <name>' is used
  notFound: "§cRace not found." #Displayed when the inputted race is invalid
  end: "§cThe race has ended!" #Displayed when '/race end' is used

  #Only displayed to the command executor
  prepare: "§aPlayers will be placed automatically." #Displayed when '/race prepare' is used (and prepare toggled OFF)
  cancelPrepare: "§aPreparation mode disabled." #Displayed when '/race prepare' is used (and prepare toggled ON)
  deleted: "§aRace %race% has been deleted."#Displayed when '/race delete' is used and is successful
  currentLapCount: "§bThe lap count for race %race% is set to §3%lapCount%§b. \n§8ℹ Use /race setLapCount <name> <amount>"
  updatedLapCount: "§bThe lap count for race §3%race%§b has been set to §3%lapCount%§b."
  invalidNumber: "§cThe entered lap count is invalid."

  #Help message
  help: "§3--------- §b§l/race§r §3---------\n§3->§a start [name] §8-§7 Start the race\n§3->§a prepare [name] §8-§7 Prepare the players\n§7§oℹ Automatically places players in their cars\n§3->§a end [name] §8-§7 End the race\n§3->§a delete [name] §8-§7 Delete the race\n§3->§a setLapCount [name] <amount> §8-§7 Set the lap count"

  #In race events
  onCompleteLap:
    title: "§6%currentLapCount%/%raceLapCount%"
    subtitle: "§alaps completed"
    message: "§3%player%§b finished lap n°§3%ID%§b in §3%time%§b!"
    messageBestLapTimeYet: "§3%player%§b finished lap n°§3%ID%§b with a record time of §3%time%§b (best time so far)!"
  onCrossSector: "§bTime for §3%player%§b at sector §3%ID%§b : §3%time%§b"
  onFinish:
    message: "§2%player%§b finished the race in §2%time%§a and ranked §2#%ranking%§a!"
    title: "§2Race Finished!"
    subtitle: "§aYou are #%ranking%"
    statsMessage: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lRace Results §x§0§0§A§D§F§F§l▬▬▬▬▬▬\n\n    §bRanking : §3#%ranking%§b/%players%\n\n    §bTotal Time : §x§4§0§C§4§F§F%raceTime%\n\n    §bAverage Lap : §3%meanLapTime%\n\n    §bBest Lap : §a%bestLapTime%\n\n    §bSlowest Lap : §c%worstLapTime%\n\n    §bBest Times per Sector:\n\n    %bestSectorsTimes%\n    \n\n    §bGap to Winner : §c%gapToWinner%\n\n    §bGap to Next Player : §x§F§F§D§7§0§0%gapToNext%\n\n    §x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n\n    "
    statsMessageWinner: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lRace Results §x§0§0§A§D§F§F§l▬▬▬▬▬▬\n\n    §bRanking : §3§l#%ranking%§b/%players%\n\n    §bTotal Time : §x§4§0§C§4§F§F%raceTime%\n\n    §bAverage Lap : §3%meanLapTime%\n\n    §bBest Lap : §a%bestLapTime%\n\n    §bSlowest Lap : §c%worstLapTime%\n\n    §bBest Times per Sector:\n\n    %bestSectorsTimes%\n    §x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n\n    "
    sectorFormat: "§b- Sector §3#%sectorID% §8» §a%time%\n"
  onEnd:
    top: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lFinal Standings §x§0§0§A§D§F§F§l▬▬▬▬▬▬\n"
    playerFormat: "§3#%ranking% §b%player% §8» §x§4§0§C§4§F§F%raceTime%\n"
    highlights: "\n§b🏆 Best Lap : §a%bestLapPlayer% §8(§a%bestLapTime%§8)\n\n    §b🐢 Slowest Lap : §c%worstLapPlayer% §8(§c%worstLapTime%§8)\n\n    §b⚡ Victory Gap : §3%winnerGap%\n"
    bestSectorTimesTop: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬ §x§5§5§D§D§F§F§lBest Sectors §x§0§0§A§D§F§F§l▬▬▬▬▬\n"
    sectorFormat: "§bSector §3#%sectorID% §8» §a%player% §8(§e%time%§8)\n"
    bottom: "§x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n"


  select: "§bSelect a race:"
  create:
    confirm: "confirm" #Confirm race deletion
    cancel: "cancel" #The message to send to cancel the race creation process
    confirmCancel: "§eAre you sure you want to cancel the race creation?\nUse §c%confirm%§e to confirm and §a%cancel%§e to cancel deletion."
    cancelled: "§bRace creation has been cancelled." #When you cancel the creation
    #Naming the race
    1:
      title: "§3Race Name"
      subtitle: "§bEnter the §3name§b in chat"
      message: "§bStart by entering the race name below (in chat)."
      completed: "§bThe race name has been set to §3%name%"
      alreadyExists: "§cA race with this name already exists, please choose another name."
    2:
      title: "§3Lap Count"
      subtitle: "§bEnter the §3number§b in chat"
      message: "§bEnter the number of §3laps§b to §3complete§b to §3finish§b the race (in chat)."
      completed: "§bThe §3lap count§b of the race has been set to §3%lapCount%"

    #Define the checkpoints?
    3:
      title: "§3Checkpoints?"
      subtitle: "§bDefine checkpoints?"
      start: "start"
      later: "not now"
      message: "§bDefine the points that the race passes through. \n-> Enter §3%start%§b to start or §3%later%§b to configure this later.\n§8§oℹ These will be used to update participants' live scores. You can always do this later!"


    #Checkpoints definition process
    4:
      title: "§3Checkpoint Creation"
      subtitle: "§bStart defining checkpoints"
      message: "§bDefine the race checkpoints by going to each location.\n§b-> §3%define%§b to set a checkpoint\n§b-> §3%defineSector%§b to set a sector checkpoint\n§b-> §3%defineFinish%§b to set the finish line §8§o(if different from start)\n§b-> §3%help%§b to display help\n§b-> §3%done%§b to finish\n§8§oℹ︎ A sector works like a checkpoint, but also announces the sector time in chat.\n§8§oℹ︎ To define a checkpoint, left-click for point 1 and right-click for point 2 with a §3§owooden shovel§8§o, just like with WorldEdit."
      checkpointCreation:
        define: "define"
        defineSector: "define sector"
        defineFinish: "define finish"
        help: "help"
        done: "save"
      feedback:
        startDefined:
          title: "§3Start Defined"
          subtitle: "§bThe §3start§b line has been defined"
        finishDefined:
          title: "§3Finish Defined"
          subtitle: "§bThe §3finish§b line has been defined"
        checkpointDefined:
          title: "§3Checkpoint Defined"
          subtitle: "§bCheckpoint §3%checkpointID%§b has been defined"
        sectorDefined:
          title: "§3Sector Defined"
          subtitle: "§bSector §3%sectorID%§b has been defined"
        done:
          title: "§2Done"
          subtitle: "§aCheckpoints saved!"
        error:
          #Will be shown if the player tries to define a sector first (before defining start line)
          defineStartLineFirst: "§cDefine the start line first before doing this."

    5:
      title: "§3Cars?"
      subtitle: "§bDefine cars?"
      message: "§bDefine the points where the race participants' cars spawn. \n-> Enter §3%start%§b to start or §3%later%§b to configure this later.\n§8§oℹ︎ These will be automatically placed when the race starts, and their passengers teleported inside. You can always do this later!"
      start: "start"
      later: "not now"
    6:
      title: "§3Car Creation"
      subtitle: "§bCreation is starting..."
      message: "§bThe car creation process is starting...\n§8§oℹSend %done% to save when you are finished."
      carCreation:
        done: "save"
      feedback:
        endInstructions:
          actionBar: "§aSend %done% to finish creation"
        done:
          title: "§2Done"
          subtitle: "§aCars saved!"

    done:
      title: "§3Race Saved!"
      subtitle: "§bThe race has been successfully created"
      message: "§aThe race has been successfully saved!\n§b-> §3/checkpoint create§b to add checkpoints to the race\n§b-> §3/car create§b to register cars\n§b-> §3/race info <raceName>§b to view race information"

car:
  #Errors
  invalidID: "§cNo car with ID §4%id%"
  noCars: "§cNo cars defined."

  #Command success feedback
  changedOwner: "§aOwner changed: %owner%"
  removed: "§aCar removed (id %id%)"

  #Messages/titles shown in the car creation process
  create:
    1:
      title: "§3Set Spawn"
      subtitle: "§3%check% §bto validate"
      message: "§bBreak the spawn block, then write §3%check%§b."
      selected: "§bBlock selected, write §3%check%§b."
      noSelection: "§cSelect a block first!"
      check: "done"
      completed: "§aPosition saved."

    2:
      title: "§3Owner Name"
      subtitle: "§bEnter the owner's name in chat"
      message: "§bWrite the owner's name in chat."
      completed: "§aOwner: %owner%."

    3:
      title: "§3Choose Boat"
      subtitle: "§3%check% §bto validate"
      message: "§bHold a boat then write §3%check%§b."
      invalidItem: "§cHold a boat in your hand!"
      check: "done"

    completed:
      message: "§bThe car has been saved!"
      title: "§2§lDone !"
      subtitle: "§aCar saved"

#Some basic error messages
error:
  invalidNumber: "§cInvalid number"
  playerNotFound: "§cPlayer not found"
  playerToExecuteCommand: "§cYou must be a player to do that."
  unknown: "§cAn unknown error occurred. Please check the console for error messages."